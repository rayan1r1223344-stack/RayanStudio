<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>حاسبة النسبة المئوية | نبض أدوات</title>

<meta name="description" content="حاسبة النسبة المئوية المجانية من نبض أدوات. احسب النسبة والزيادة والنقصان بسهولة وسرعة.">

<style>
*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,Tahoma,sans-serif;
background:#f5f7fb;
color:#172033;
}

header{
background:#fff;
padding:18px 6%;
border-bottom:1px solid #e5e8ef;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
font-size:23px;
font-weight:bold;
color:#172033;
text-decoration:none;
}

.home{
text-decoration:none;
color:#3157d5;
font-weight:bold;
}

main{
max-width:900px;
margin:auto;
padding:45px 20px;
}

.card{
background:#fff;
border-radius:20px;
padding:25px;
margin-bottom:20px;
box-shadow:0 10px 30px rgba(0,0,0,.06);
border:1px solid #e5e8ef;
}

h1{
text-align:center;
font-size:32px;
margin-top:0;
}

.intro{
text-align:center;
color:#687286;
line-height:1.8;
}

.calculator{
display:grid;
gap:15px;
margin-top:25px;
}

label{
font-weight:bold;
margin-bottom:5px;
}

input{
width:100%;
padding:14px;
border:1px solid #dfe3eb;
border-radius:12px;
font-size:18px;
outline:none;
}

input:focus{
border-color:#3157d5;
}

button{
border:0;
border-radius:11px;
padding:13px 20px;
background:#3157d5;
color:white;
font-size:16px;
font-weight:bold;
cursor:pointer;
}

button.secondary{
background:#edf0f6;
color:#263247;
}

.result{
margin-top:20px;
padding:20px;
background:#f7f8fc;
border-radius:15px;
text-align:center;
}

.result strong{
display:block;
font-size:30px;
color:#3157d5;
margin-top:8px;
}

.buttons{
display:flex;
gap:10px;
flex-wrap:wrap;
margin-top:15px;
}

.message{
min-height:22px;
color:#3157d5;
font-weight:bold;
margin-top:12px;
}

footer{
text-align:center;
padding:30px;
color:#687286;
}

@media(max-width:600px){

header{
padding:15px 5%;
}

main{
padding:30px 15px;
}

h1{
font-size:27px;
}
}
</style>
</head>

<body>

<header>

<a class="logo" href="index.html">
نبض أدوات
</a>

<a class="home" href="index.html">
الرئيسية
</a>

</header>

<main>

<div class="card">

<h1>🧮 حاسبة النسبة المئوية</h1>

<p class="intro">
احسب النسبة المئوية بسهولة وسرعة.
</p>

<div class="calculator">

<div>
<label for="number">العدد</label>
<input id="number" type="number" inputmode="decimal" placeholder="مثال: 25">
</div>

<div>
<label for="total">من أصل</label>
<input id="total" type="number" inputmode="decimal" placeholder="مثال: 100">
</div>

<button id="calculate">
احسب النسبة
</button>

</div>

<div class="result">

النسبة المئوية:

<strong id="result">0%</strong>

</div>

<div class="buttons">

<button id="clear" class="secondary">
مسح
</button>

<button id="copy">
نسخ النتيجة
</button>

</div>

<p class="message" id="message"></p>

</div>


<div class="card">

<h2>طريقة حساب النسبة المئوية</h2>

<p>
أدخل العدد الذي تريد معرفة نسبته، ثم أدخل العدد الكلي واضغط على «احسب النسبة».
</p>

<p>
مثال: إذا كان العدد 25 من أصل 100، فالنتيجة هي 25%.
</p>

</div>

</main>

<footer>

© 2026 نبض أدوات — جميع الحقوق محفوظة

</footer>

<script>

const numberInput = document.getElementById("number");
const totalInput = document.getElementById("total");
const result = document.getElementById("result");
const message = document.getElementById("message");

function calculatePercentage(){

const number = parseFloat(numberInput.value);
const total = parseFloat(totalInput.value);

if(isNaN(number) || isNaN(total)){

result.textContent = "0%";
message.textContent = "أدخل العدد والعدد الكلي أولًا.";

return;

}

if(total === 0){

result.textContent = "0%";
message.textContent = "لا يمكن القسمة على صفر.";

return;

}

const percentage = (number / total) * 100;

result.textContent =
percentage.toLocaleString("ar-SA",{
maximumFractionDigits:2
}) + "%";

message.textContent = "";

}

document.getElementById("calculate")
.addEventListener("click",calculatePercentage);


document.getElementById("clear")
.addEventListener("click",function(){

numberInput.value = "";
totalInput.value = "";
result.textContent = "0%";
message.textContent = "";

});


document.getElementById("copy")
.addEventListener("click",async function(){

const value = result.textContent;

if(value === "0%"){

message.textContent = "احسب النسبة أولًا.";

return;

}

try{

await navigator.clipboard.writeText(value);

message.textContent = "تم نسخ النتيجة.";

}catch(error){

const temporary = document.createElement("textarea");

temporary.value = value;

document.body.appendChild(temporary);

temporary.select();

document.execCommand("copy");

temporary.remove();

message.textContent = "تم نسخ النتيجة.";

}

});

</script>

</body>
</html>
