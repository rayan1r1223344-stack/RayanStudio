<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>حاسبة العمر | نبض أدوات</title>

<meta name="description" content="حاسبة عمر مجانية وسريعة من نبض أدوات. احسب عمرك بالسنوات والأشهر والأيام بسهولة.">

<style>
*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,Tahoma,sans-serif;
background:#f5f7fb;
color:#172033;
}

header{
background:#fff;
padding:18px 6%;
border-bottom:1px solid #e5e8ef;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
font-size:23px;
font-weight:bold;
color:#172033;
text-decoration:none;
}

.home{
text-decoration:none;
color:#3157d5;
font-weight:bold;
}

main{
max-width:900px;
margin:auto;
padding:45px 20px;
}

.card{
background:#fff;
border-radius:20px;
padding:25px;
margin-bottom:20px;
box-shadow:0 10px 30px rgba(0,0,0,.06);
border:1px solid #e5e8ef;
}

h1{
text-align:center;
font-size:32px;
margin-top:0;
}

.intro{
text-align:center;
color:#687286;
line-height:1.8;
}

.form{
display:grid;
gap:15px;
margin-top:25px;
}

label{
font-weight:bold;
}

input{
width:100%;
padding:14px;
border:1px solid #dfe3eb;
border-radius:12px;
font-size:18px;
outline:none;
}

input:focus{
border-color:#3157d5;
}

button{
border:0;
border-radius:11px;
padding:13px 20px;
background:#3157d5;
color:white;
font-size:16px;
font-weight:bold;
cursor:pointer;
}

button.secondary{
background:#edf0f6;
color:#263247;
}

.result{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:12px;
margin-top:25px;
}

.result-box{
background:#f7f8fc;
border-radius:15px;
padding:20px 10px;
text-align:center;
}

.result-box strong{
display:block;
font-size:28px;
color:#3157d5;
}

.result-box span{
display:block;
margin-top:7px;
color:#687286;
}

.buttons{
display:flex;
gap:10px;
flex-wrap:wrap;
margin-top:18px;
}

.message{
min-height:22px;
color:#3157d5;
font-weight:bold;
margin-top:15px;
}

footer{
text-align:center;
padding:30px;
color:#687286;
}

@media(max-width:600px){

header{
padding:15px 5%;
}

main{
padding:30px 15px;
}

h1{
font-size:27px;
}

.result{
grid-template-columns:1fr;
}

}
</style>
</head>

<body>

<header>

<a class="logo" href="index.html">
نبض أدوات
</a>

<a class="home" href="index.html">
الرئيسية
</a>

</header>

<main>

<div class="card">

<h1>🎂 حاسبة العمر</h1>

<p class="intro">
أدخل تاريخ ميلادك لمعرفة عمرك بالسنوات والأشهر والأيام.
</p>

<div class="form">

<div>
<label for="birthDate">تاريخ الميلاد</label>
<input id="birthDate" type="date">
</div>

<button id="calculate">
احسب عمري
</button>

</div>

<div class="result">

<div class="result-box">
<strong id="years">0</strong>
<span>سنة</span>
</div>

<div class="result-box">
<strong id="months">0</strong>
<span>شهر</span>
</div>

<div class="result-box">
<strong id="days">0</strong>
<span>يوم</span>
</div>

</div>

<div class="buttons">

<button id="clear" class="secondary">
مسح
</button>

</div>

<p class="message" id="message"></p>

</div>


<div class="card">

<h2>عن حاسبة العمر</h2>

<p>
أدخل تاريخ ميلادك واضغط على «احسب عمري» لمعرفة عمرك بالتفصيل.
</p>

<p>
يمكنك استخدام حاسبة العمر من الهاتف أو الكمبيوتر مجانًا.
</p>

</div>

</main>

<footer>

© 2026 نبض أدوات — جميع الحقوق محفوظة

</footer>

<script>

const birthDate = document.getElementById("birthDate");

const yearsResult = document.getElementById("years");
const monthsResult = document.getElementById("months");
const daysResult = document.getElementById("days");

const message = document.getElementById("message");

function calculateAge(){

if(!birthDate.value){

message.textContent = "اختر تاريخ الميلاد أولًا.";
return;

}

const birth = new Date(birthDate.value + "T00:00:00");

const today = new Date();

today.setHours(0,0,0,0);

if(birth > today){

message.textContent = "تاريخ الميلاد لا يمكن أن يكون في المستقبل.";

yearsResult.textContent = "0";
monthsResult.textContent = "0";
daysResult.textContent = "0";

return;

}

let years = today.getFullYear() - birth.getFullYear();

let months = today.getMonth() - birth.getMonth();

let days = today.getDate() - birth.getDate();

if(days < 0){

months--;

const previousMonth = new Date(
today.getFullYear(),
today.getMonth(),
0
);

days += previousMonth.getDate();

}

if(months < 0){

years--;
months += 12;

}

yearsResult.textContent = years;
monthsResult.textContent = months;
daysResult.textContent = days;

message.textContent = "تم حساب العمر بنجاح.";

}

document.getElementById("calculate")
.addEventListener("click",calculateAge);


document.getElementById("clear")
.addEventListener("click",function(){

birthDate.value = "";

yearsResult.textContent = "0";
monthsResult.textContent = "0";
daysResult.textContent = "0";

message.textContent = "";

});

</script>

</body>
</html>
